<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>銀英伝ロンド：星奪戦の戦闘シミュレーション</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-red: #f43f5e;
            --text-main: #f8fafc;
            --text-sub: #b6c2d4;
            --border-color: #475569;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            font-size: 17px;
            line-height: 1.5;
        }
        .container { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 20px; }
        h1 { text-align: center; font-size: 1.6rem; color: var(--accent-blue); margin: 0 0 6px; }
        p.subtitle { text-align: center; color: var(--text-sub); font-size: 0.95rem; margin: 0 0 10px; }

        .btn-group { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
        button {
            min-height: 48px;
            padding: 10px 20px;
            font-size: 1.05rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #fde68a; outline-offset: 2px; }
        .btn-calc { background-color: var(--accent-blue); color: #0f172a; }
        .btn-calc:hover { background-color: #7dd3fc; }
        .btn-sample, .btn-clear { background-color: #475569; color: var(--text-main); }
        .btn-sample:hover, .btn-clear:hover { background-color: #64748b; }

        .fleets-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .fleets-wrapper { grid-template-columns: 1fr; } }

        .fleet-card { background-color: var(--card-bg); border-radius: 12px; padding: 16px; border: 1px solid var(--border-color); }
        .fleet-title {
            font-size: 1.25rem; font-weight: bold; margin-bottom: 14px; padding-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
        }
        .fleet-a .fleet-title { color: var(--accent-blue); border-color: var(--accent-blue); }
        .fleet-b .fleet-title { color: var(--accent-red); border-color: var(--accent-red); }

        .ship-input-group {
            background-color: rgba(15, 23, 42, 0.6);
            border-radius: 8px; padding: 12px; margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }
        .ship-title { font-size: 1rem; font-weight: 600; color: var(--text-sub); margin-bottom: 8px; }

        /* 1行 = ラベル | MAX値入力 | 効率プルダウン */
        .stat-row { display: grid; grid-template-columns: 4.2em 1fr 5.6em; gap: 8px; align-items: center; margin-bottom: 8px; }
        .stat-row label { font-size: 0.95rem; color: var(--text-sub); }
        .stat-row input, .stat-row select {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            font-size: 1.1rem;   /* 16px以上：iPhoneで入力時に拡大されない */
            min-height: 44px;
            padding: 6px 8px;
            width: 100%;
            box-sizing: border-box;
        }
        .stat-row input:focus, .stat-row select:focus { border-color: var(--accent-blue); }
        .eff-preview { font-size: 0.9rem; color: var(--text-sub); margin-top: 4px; }
        .eff-preview strong { color: var(--text-main); }

        .result-card { background-color: var(--card-bg); border-radius: 12px; padding: 16px; border: 1px solid var(--border-color); display: none; }
        .round-item { background-color: #0f172a; border-radius: 8px; padding: 14px; margin-bottom: 14px; border-left: 4px solid var(--border-color); }
        .round-item.win-a { border-left-color: var(--accent-blue); }
        .round-item.win-b { border-left-color: var(--accent-red); }
        .round-header { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; font-size: 1rem; font-weight: bold; margin-bottom: 10px; }
        .gauge-container { margin-top: 10px; }
        .gauge-label { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; font-size: 0.95rem; margin-bottom: 5px; }
        .gauge-bar-bg { width: 100%; height: 22px; background-color: #334155; border-radius: 11px; overflow: hidden; }
        .gauge-bar-fill {
            height: 100%; display: flex; align-items: center; justify-content: flex-end;
            padding-right: 8px; font-size: 0.8rem; font-weight: bold; color: #ffffff; box-sizing: border-box;
        }
        .fill-a { background: linear-gradient(90deg, #0284c7, var(--accent-blue)); }
        .fill-b { background: linear-gradient(90deg, #e11d48, var(--accent-red)); }
        .fill-empty { background-color: #475569; width: 0% !important; }
        .winner-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.9rem; font-weight: bold; }
        .badge-a { background-color: rgba(56, 189, 248, 0.2); color: var(--accent-blue); }
        .badge-b { background-color: rgba(244, 63, 94, 0.2); color: var(--accent-red); }
        .summary-banner { text-align: center; padding: 15px; border-radius: 8px; font-size: 1.25rem; font-weight: bold; margin-bottom: 20px; }
        .summary-a { background-color: rgba(56, 189, 248, 0.15); color: var(--accent-blue); border: 1px solid var(--accent-blue); }
        .summary-b { background-color: rgba(244, 63, 94, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }
    </style>
</head>
<body>

<div class="container">
    <div>
        <h1>🚀銀英伝ロンド：星奪戦の戦闘シミュ🚀</h1>
        <p class="subtitle">防御補正対応・戦闘後残り耐久力計算ツール<br>
            (単位：攻防▶️k・耐久▶️M)<br>
            MAX値を入力し、右のプルダウンで効率(%)を選ぶと、MAX値×効率で自動計算します</p>
    </div>

    <div class="btn-group">
        <button class="btn-sample" onclick="loadSampleData()">📋 サンプルデータを設定</button>
        <button class="btn-clear" onclick="clearInputs()">🗑️ 入力をクリア</button>
        <button class="btn-calc" onclick="calculateBattle()">⚔️ 戦闘計算を実行</button>
    </div>

    <div class="fleets-wrapper">
        <div class="fleet-card fleet-a">
            <div class="fleet-title">艦隊 A</div>
            <div id="fleetA-inputs"></div>
        </div>
        <div class="fleet-card fleet-b">
            <div class="fleet-title">艦隊 B</div>
            <div id="fleetB-inputs"></div>
        </div>
    </div>

    <div id="result-card" class="result-card">
        <div id="summary-banner" class="summary-banner"></div>
        <h3 style="margin-top: 0; color: var(--text-sub);">📊 ラウンド別 残り耐久力の推移</h3>
        <div id="rounds-container"></div>
    </div>
</div>

<script>
    const STATS = [
        { key: 'atk', label: '攻撃力' },
        { key: 'def', label: '防御力' },
        { key: 'hp',  label: '耐久力' }
    ];

    // 効率プルダウンの選択肢 (100% → 0%)
    function effOptions() {
        let html = '';
        for (let p = 100; p >= 0; p -= 10) {
            html += `<option value="${p}"${p === 100 ? ' selected' : ''}>${p}%</option>`;
        }
        return html;
    }

    // 入力フォームの自動生成
    function createInputFields() {
        ['A', 'B'].forEach(fleet => {
            const container = document.getElementById(`fleet${fleet}-inputs`);
            let html = '';
            for (let i = 1; i <= 3; i++) {
                html += `<div class="ship-input-group"><div class="ship-title">${i}番艦</div>`;
                STATS.forEach(s => {
                    html += `
                        <div class="stat-row">
                            <label for="${s.key}_${fleet}_${i}">${s.label}</label>
                            <input type="number" inputmode="decimal" min="0" step="any" placeholder="MAX値"
                                   id="${s.key}_${fleet}_${i}" oninput="updatePreview('${fleet}', ${i})">
                            <select id="${s.key}_eff_${fleet}_${i}" aria-label="${s.label}の効率"
                                    onchange="updatePreview('${fleet}', ${i})">${effOptions()}</select>
                        </div>`;
                });
                html += `<div class="eff-preview" id="preview_${fleet}_${i}"></div></div>`;
            }
            container.innerHTML = html;
        });
    }

    // MAX値 × 効率% を返す
    function getStat(key, fleet, i) {
        const max = parseFloat(document.getElementById(`${key}_${fleet}_${i}`).value) || 0;
        const eff = parseFloat(document.getElementById(`${key}_eff_${fleet}_${i}`).value);
        return max * (isNaN(eff) ? 100 : eff) / 100;
    }

    const fmt = n => n.toLocaleString(undefined, { maximumFractionDigits: 2 });

    // 効率適用後の値を確認用に表示
    function updatePreview(fleet, i) {
        const el = document.getElementById(`preview_${fleet}_${i}`);
        const atk = getStat('atk', fleet, i), def = getStat('def', fleet, i), hp = getStat('hp', fleet, i);
        el.innerHTML = (atk || def || hp)
            ? `効率適用後 ▶ 攻 <strong>${fmt(atk)}</strong> / 防 <strong>${fmt(def)}</strong> / 耐 <strong>${fmt(hp)}</strong>`
            : '';
    }

    function refreshAllPreviews() {
        ['A', 'B'].forEach(f => [1, 2, 3].forEach(i => updatePreview(f, i)));
    }

    function setShip(fleet, i, ship) {
        STATS.forEach(s => {
            document.getElementById(`${s.key}_${fleet}_${i}`).value = ship[s.key] || '';
            document.getElementById(`${s.key}_eff_${fleet}_${i}`).value = '100';
        });
    }

    // サンプルデータ設定 (効率はすべて100%)
    function loadSampleData() {
        const sampleA = [
            { atk: 160, def: 158.2, hp: 2657 },
            { atk: 880.3, def: 1310, hp: 8127 },
            { atk: 1677, def: 1312, hp: 14100 }
        ];
        const sampleB = [
            { atk: 26.63, def: 26.63, hp: 34.9 },
            { atk: 2592, def: 918.4, hp: 12100 },
            { atk: 0, def: 0, hp: 0 }
        ];
        sampleA.forEach((ship, idx) => setShip('A', idx + 1, ship));
        sampleB.forEach((ship, idx) => setShip('B', idx + 1, ship));
        refreshAllPreviews();
        calculateBattle();
    }

    // 入力クリア
    function clearInputs() {
        ['A', 'B'].forEach(f => [1, 2, 3].forEach(i => setShip(f, i, {})));
        refreshAllPreviews();
        document.getElementById('result-card').style.display = 'none';
    }

    // 防御補正計算関数
    function getDefenseCorrection(atk, enemyDef) {
        if (enemyDef <= 0) return 1;
        const ratio = atk / enemyDef;
        if (ratio > 2) {
            return 1 / (0.75 - Math.log(ratio - 2) / 10);
        }
        return 1;
    }

    // 戦闘計算＆描画
    function calculateBattle() {
        const fleetA = [];
        const fleetB = [];

        for (let i = 1; i <= 3; i++) {
            const atkA = getStat('atk', 'A', i), defA = getStat('def', 'A', i), hpA = getStat('hp', 'A', i);
            if (hpA > 0 && atkA > 0) fleetA.push({ id: i, atk: atkA, def: defA, maxHp: hpA, curHp: hpA });

            const atkB = getStat('atk', 'B', i), defB = getStat('def', 'B', i), hpB = getStat('hp', 'B', i);
            if (hpB > 0 && atkB > 0) fleetB.push({ id: i, atk: atkB, def: defB, maxHp: hpB, curHp: hpB });
        }

        if (fleetA.length === 0 || fleetB.length === 0) {
            alert('両艦隊に少なくとも1隻以上の戦艦情報（攻撃/防御/耐久）を入力してください。\n※効率0%の項目は計算対象外になります。');
            return;
        }

        let idxA = 0;
        let idxB = 0;
        let round = 1;
        const roundLogs = [];

        while (idxA < fleetA.length && idxB < fleetB.length) {
            const shipA = fleetA[idxA];
            const shipB = fleetB[idxB];

            const corrA = getDefenseCorrection(shipA.atk, shipB.def);
            const corrB = getDefenseCorrection(shipB.atk, shipA.def);

            const powerA = shipA.atk * shipA.curHp * corrA;
            const powerB = shipB.atk * shipB.curHp * corrB;

            if (powerA >= powerB) {
                const hpLossA = powerB / (shipA.atk * corrA);
                shipA.curHp = Math.max(0, shipA.curHp - hpLossA);
                shipB.curHp = 0;
                roundLogs.push({ round, winner: 'A', shipA: { ...shipA }, shipB: { ...shipB }, corrA, corrB });
                idxB++;
            } else {
                const hpLossB = powerA / (shipB.atk * corrB);
                shipB.curHp = Math.max(0, shipB.curHp - hpLossB);
                shipA.curHp = 0;
                roundLogs.push({ round, winner: 'B', shipA: { ...shipA }, shipB: { ...shipB }, corrA, corrB });
                idxA++;
            }
            round++;
        }

        renderResults(fleetA, fleetB, roundLogs, idxA < fleetA.length ? 'A' : 'B');
    }

    function renderResults(fleetA, fleetB, logs, overallWinner) {
        const resultCard = document.getElementById('result-card');
        const summaryBanner = document.getElementById('summary-banner');
        const roundsContainer = document.getElementById('rounds-container');

        resultCard.style.display = 'block';

        if (overallWinner === 'A') {
            summaryBanner.className = 'summary-banner summary-a';
            summaryBanner.innerHTML = '🏆 艦隊 A の勝利！';
        } else {
            summaryBanner.className = 'summary-banner summary-b';
            summaryBanner.innerHTML = '🏆 艦隊 B の勝利！';
        }

        roundsContainer.innerHTML = '';
        logs.forEach(log => {
            const isWinA = log.winner === 'A';
            const winnerShip = isWinA ? log.shipA : log.shipB;
            const loserShip = isWinA ? log.shipB : log.shipA;

            const winPct = ((winnerShip.curHp / winnerShip.maxHp) * 100).toFixed(1);
            const winFleetName = isWinA ? '艦隊 A' : '艦隊 B';
            const winFillClass = isWinA ? 'fill-a' : 'fill-b';
            const badgeClass = isWinA ? 'badge-a' : 'badge-b';

            roundsContainer.innerHTML += `
                <div class="round-item ${isWinA ? 'win-a' : 'win-b'}">
                    <div class="round-header">
                        <span>Round ${log.round}: 艦隊A ${log.shipA.id}番艦 vs 艦隊B ${log.shipB.id}番艦</span>
                        <span class="winner-badge ${badgeClass}">${winFleetName} 勝利</span>
                    </div>
                    <div class="gauge-container">
                        <div class="gauge-label">
                            <span><strong>${winFleetName} ${winnerShip.id}番艦 (勝利)</strong></span>
                            <span>残り耐久: <strong>${winnerShip.curHp.toLocaleString(undefined, {maximumFractionDigits: 1})}</strong> / ${winnerShip.maxHp.toLocaleString(undefined, {maximumFractionDigits: 1})} (${winPct}%)</span>
                        </div>
                        <div class="gauge-bar-bg">
                            <div class="gauge-bar-fill ${winFillClass}" style="width: ${winPct}%;">
                                ${winPct > 10 ? winPct + '%' : ''}
                            </div>
                        </div>
                    </div>
                    <div class="gauge-container" style="margin-top: 8px; opacity: 0.75;">
                        <div class="gauge-label">
                            <span>${isWinA ? '艦隊 B' : '艦隊 A'} ${loserShip.id}番艦 (撃沈)</span>
                            <span>残り耐久: 0 / ${loserShip.maxHp.toLocaleString(undefined, {maximumFractionDigits: 1})} (0%)</span>
                        </div>
                        <div class="gauge-bar-bg"><div class="gauge-bar-fill fill-empty"></div></div>
                    </div>
                </div>
            `;
        });
    }

    createInputFields();
</script>

</body>
</html>
