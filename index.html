<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>銀英伝ロンド：星奪戦の戦闘シミュレーション</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-red: #f43f5e;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            color: var(--accent-blue);
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-calc {
            background-color: var(--accent-blue);
            color: #0f172a;
        }
        .btn-calc:hover { background-color: #7dd3fc; }

        .btn-sample {
            background-color: #475569;
            color: var(--text-main);
        }
        .btn-sample:hover { background-color: #64748b; }

        .fleets-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .fleets-wrapper { grid-template-columns: 1fr; }
        }

        .fleet-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        .fleet-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .fleet-a .fleet-title { color: var(--accent-blue); border-color: var(--accent-blue); }
        .fleet-b .fleet-title { color: var(--accent-red); border-color: var(--accent-red); }

        .ship-input-group {
            background-color: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        .ship-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .inputs-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-box label {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .input-box input {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 0.9rem;
            width: 100%;
            box-sizing: border-box;
        }

        .input-box input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        /* 結果表示領域 */
        .result-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            display: none;
        }

        .round-item {
            background-color: #0f172a;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 15px;
            border-left: 4px solid var(--border-color);
        }

        .round-item.win-a { border-left-color: var(--accent-blue); }
        .round-item.win-b { border-left-color: var(--accent-red); }

        .round-header {
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .gauge-container {
            margin-top: 10px;
        }

        .gauge-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .gauge-bar-bg {
            width: 100%;
            height: 20px;
            background-color: #334155;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .gauge-bar-fill {
            height: 100%;
            transition: width 0.5s ease-out;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #ffffff;
            box-sizing: border-box;
        }

        .fill-a { background: linear-gradient(90deg, #0284c7, var(--accent-blue)); }
        .fill-b { background: linear-gradient(90deg, #e11d48, var(--accent-red)); }
        .fill-empty { background-color: #475569; width: 0% !important; }

        .winner-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .badge-a { background-color: rgba(56, 189, 248, 0.2); color: var(--accent-blue); }
        .badge-b { background-color: rgba(244, 63, 94, 0.2); color: var(--accent-red); }

        .summary-banner {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .summary-a { background-color: rgba(56, 189, 248, 0.15); color: var(--accent-blue); border: 1px solid var(--accent-blue); }
        .summary-b { background-color: rgba(244, 63, 94, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }
    </style>
</head>
<body>

<div class="container">
    <div>
        <h1>🚀銀英伝ロンド：星奪戦の戦闘シミュ🚀</h1>
        <p class="subtitle">防御補正対応・戦闘後残り耐久力計算ツール<br>
            (単位：攻防▶️k・耐久▶️M)</p>
    </div>

    <div class="btn-group">
        <button class="btn-sample" onclick="loadSampleData()">📋 サンプルデータを設定</button>
        <button class="btn-calc" onclick="calculateBattle()">⚔️ 戦闘計算を実行</button>
    </div>

    <div class="fleets-wrapper">
        <!-- 艦隊 A -->
        <div class="fleet-card fleet-a">
            <div class="fleet-title">
                <span>艦隊 A</span>
            </div>
            <div id="fleetA-inputs"></div>
        </div>

        <!-- 艦隊 B -->
        <div class="fleet-card fleet-b">
            <div class="fleet-title">
                <span>艦隊 B</span>
            </div>
            <div id="fleetB-inputs"></div>
        </div>
    </div>

    <!-- 結果表示領域 -->
    <div id="result-card" class="result-card">
        <div id="summary-banner" class="summary-banner"></div>
        <h3 style="margin-top: 0; color: var(--text-sub);">📊 ラウンド別 残り耐久力の推移</h3>
        <div id="rounds-container"></div>
    </div>
</div>

<script>
    // 入力フォームの自動生成
    function createInputFields() {
        ['A', 'B'].forEach(fleet => {
            const container = document.getElementById(`fleet${fleet}-inputs`);
            container.innerHTML = '';
            for (let i = 1; i <= 3; i++) {
                container.innerHTML += `
                    <div class="ship-input-group">
                        <div class="ship-title">${i}番艦</div>
                        <div class="inputs-row">
                            <div class="input-box">
                                <label>攻撃力</label>
                                <input type="number" id="atk_${fleet}_${i}" step="any" placeholder="0">
                            </div>
                            <div class="input-box">
                                <label>防御力</label>
                                <input type="number" id="def_${fleet}_${i}" step="any" placeholder="0">
                            </div>
                            <div class="input-box">
                                <label>耐久力</label>
                                <input type="number" id="hp_${fleet}_${i}" step="any" placeholder="0">
                            </div>
                        </div>
                    </div>
                `;
            }
        });
    }

    // サンプルデータ設定
    function loadSampleData() {
        const sampleA = [
            { atk: 160, def: 158.2, hp: 2657 },
            { atk: 880.3, def: 1310, hp: 8127 },
            { atk: 1677, def: 1312, hp: 14100 }
        ];
        const sampleB = [
            { atk: 26.63, def: 26.63, hp: 34.9 },
            { atk: 2592, def: 918.4, hp: 12100 },
            { atk: 0, def: 0, hp: 0 }
        ];

        sampleA.forEach((ship, idx) => {
            document.getElementById(`atk_A_${idx+1}`).value = ship.atk || '';
            document.getElementById(`def_A_${idx+1}`).value = ship.def || '';
            document.getElementById(`hp_A_${idx+1}`).value = ship.hp || '';
        });

        sampleB.forEach((ship, idx) => {
            document.getElementById(`atk_B_${idx+1}`).value = ship.atk || '';
            document.getElementById(`def_B_${idx+1}`).value = ship.def || '';
            document.getElementById(`hp_B_${idx+1}`).value = ship.hp || '';
        });

        calculateBattle();
    }

    // 防御補正計算関数
    function getDefenseCorrection(atk, enemyDef) {
        if (enemyDef <= 0) return 1;
        const ratio = atk / enemyDef;
        if (ratio > 2) {
            return 1 / (0.75 - Math.log(ratio - 2) / 10);
        }
        return 1;
    }

    // 戦闘計算＆描画
    function calculateBattle() {
        const fleetA = [];
        const fleetB = [];

        for (let i = 1; i <= 3; i++) {
            const atkA = parseFloat(document.getElementById(`atk_A_${i}`).value) || 0;
            const defA = parseFloat(document.getElementById(`def_A_${i}`).value) || 0;
            const hpA = parseFloat(document.getElementById(`hp_A_${i}`).value) || 0;
            if (hpA > 0 && atkA > 0) fleetA.push({ id: i, atk: atkA, def: defA, maxHp: hpA, curHp: hpA });

            const atkB = parseFloat(document.getElementById(`atk_B_${i}`).value) || 0;
            const defB = parseFloat(document.getElementById(`def_B_${i}`).value) || 0;
            const hpB = parseFloat(document.getElementById(`hp_B_${i}`).value) || 0;
            if (hpB > 0 && atkB > 0) fleetB.push({ id: i, atk: atkB, def: defB, maxHp: hpB, curHp: hpB });
        }

        if (fleetA.length === 0 || fleetB.length === 0) {
            alert('両艦隊に少なくとも1隻以上の戦艦情報（攻撃/防御/耐久）を入力してください。');
            return;
        }

        let idxA = 0;
        let idxB = 0;
        let round = 1;
        const roundLogs = [];

        while (idxA < fleetA.length && idxB < fleetB.length) {
            const shipA = fleetA[idxA];
            const shipB = fleetB[idxB];

            // 補正計算
            const corrA = getDefenseCorrection(shipA.atk, shipB.def);
            const corrB = getDefenseCorrection(shipB.atk, shipA.def);

            // 戦闘力計算
            const powerA = shipA.atk * shipA.curHp * corrA;
            const powerB = shipB.atk * shipB.curHp * corrB;

            let winner = '';
            let hpLossA = 0;
            let hpLossB = 0;

            if (powerA >= powerB) {
                // A 勝利
                winner = 'A';
                hpLossA = powerB / (shipA.atk * corrA);
                shipA.curHp = Math.max(0, shipA.curHp - hpLossA);
                shipB.curHp = 0;

                roundLogs.push({
                    round: round,
                    winner: 'A',
                    shipA: { ...shipA },
                    shipB: { ...shipB },
                    corrA: corrA,
                    corrB: corrB
                });

                idxB++; // B 艦沈没
            } else {
                // B 勝利
                winner = 'B';
                hpLossB = powerA / (shipB.atk * corrB);
                shipB.curHp = Math.max(0, shipB.curHp - hpLossB);
                shipA.curHp = 0;

                roundLogs.push({
                    round: round,
                    winner: 'B',
                    shipA: { ...shipA },
                    shipB: { ...shipB },
                    corrA: corrA,
                    corrB: corrB
                });

                idxA++; // A 艦沈没
            }
            round++;
        }

        // 結果描画
        renderResults(fleetA, fleetB, roundLogs, idxA < fleetA.length ? 'A' : 'B');
    }

    function renderResults(fleetA, fleetB, logs, overallWinner) {
        const resultCard = document.getElementById('result-card');
        const summaryBanner = document.getElementById('summary-banner');
        const roundsContainer = document.getElementById('rounds-container');

        resultCard.style.display = 'block';

        // 勝利バナー
        if (overallWinner === 'A') {
            summaryBanner.className = 'summary-banner summary-a';
            summaryBanner.innerHTML = '🏆 艦隊 A の勝利！';
        } else {
            summaryBanner.className = 'summary-banner summary-b';
            summaryBanner.innerHTML = '🏆 艦隊 B の勝利！';
        }

        // ラウンド別ゲージバー描画
        roundsContainer.innerHTML = '';
        logs.forEach(log => {
            const isWinA = log.winner === 'A';
            const winnerShip = isWinA ? log.shipA : log.shipB;
            const loserShip = isWinA ? log.shipB : log.shipA;

            const winPct = ((winnerShip.curHp / winnerShip.maxHp) * 100).toFixed(1);
            const winFleetName = isWinA ? '艦隊 A' : '艦隊 B';
            const winFillClass = isWinA ? 'fill-a' : 'fill-b';
            const badgeClass = isWinA ? 'badge-a' : 'badge-b';

            roundsContainer.innerHTML += `
                <div class="round-item ${isWinA ? 'win-a' : 'win-b'}">
                    <div class="round-header">
                        <span>Round ${log.round}: 艦隊A ${log.shipA.id}番艦 vs 艦隊B ${log.shipB.id}番艦</span>
                        <span class="winner-badge ${badgeClass}">${winFleetName} 勝利</span>
                    </div>

                    <!-- 勝利艦のゲージバー -->
                    <div class="gauge-container">
                        <div class="gauge-label">
                            <span><strong>${winFleetName} ${winnerShip.id}番艦 (勝利)</strong></span>
                            <span>残り耐久: <strong>${winnerShip.curHp.toLocaleString(undefined, {maximumFractionDigits: 1})}</strong> / ${winnerShip.maxHp.toLocaleString()} (${winPct}%)</span>
                        </div>
                        <div class="gauge-bar-bg">
                            <div class="gauge-bar-fill ${winFillClass}" style="width: ${winPct}%;">
                                ${winPct > 10 ? winPct + '%' : ''}
                            </div>
                        </div>
                    </div>

                    <!-- 撃沈艦のゲージバー (0%) -->
                    <div class="gauge-container" style="margin-top: 8px; opacity: 0.6;">
                        <div class="gauge-label">
                            <span>${isWinA ? '艦隊 B' : '艦隊 A'} ${loserShip.id}番艦 (撃沈)</span>
                            <span>残り耐久: 0 / ${loserShip.maxHp.toLocaleString()} (0%)</span>
                        </div>
                        <div class="gauge-bar-bg">
                            <div class="gauge-bar-fill fill-empty"></div>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    // 初期化
    createInputFields();
</script>

</body>
</html>
